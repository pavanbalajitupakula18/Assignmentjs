<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4 Step Form with Validation</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(180deg, #d94c9a, #1a47b8);
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ===== CARD ===== */
.container {
  width: 380px;
  background: #fff;
  padding: 25px;
  border-radius: 6px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}

h2 {
  text-align: center;
  margin-bottom: 20px;
}

/* ===== STEPS ===== */
.steps {
  display: flex;
  justify-content: space-between;
  margin-bottom: 25px;
}

.step {
  flex: 1;
  text-align: center;
  position: relative;
}

.step span {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid #ccc;
  font-size: 13px;
}

.step.active span,
.step.completed span {
  background: #d94c9a;
  color: #fff;
  border-color: #d94c9a;
}

.step::after {
  content: "";
  position: absolute;
  top: 13px;
  right: -50%;
  width: 100%;
  height: 2px;
  background: #ccc;
  z-index: -1;
}

.step.completed::after {
  background: #d94c9a;
}

.step:last-child::after {
  display: none;
}

/* ===== FORM ===== */
.form-step {
  display: none;
}

.form-step.active {
  display: block;
}

label {
  font-size: 13px;
  display: block;
  margin-top: 8px;
}

input {
  width: 100%;
  padding: 8px;
  margin-top: 4px;
  border-radius: 4px;
  border: 1px solid #ccc;
}

/* ===== ERROR ===== */
.error {
  color: red;
  font-size: 12px;
  margin-bottom: 8px;
  display: block;
}

/* ===== BUTTONS ===== */
.buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 15px;
}

button {
  width: 48%;
  padding: 10px;
  border: none;
  border-radius: 4px;
  cursor: pointer;
  background: #d94c9a;
  color: #fff;
}

button.secondary {
  background: #777;
}
</style>
</head>
<body>

<div class="container">
  <h2>Registration Form</h2>

  <!-- STEP INDICATOR -->
  <div class="steps">
    <div class="step active"><span>1</span></div>
    <div class="step"><span>2</span></div>
    <div class="step"><span>3</span></div>
    <div class="step"><span>4</span></div>
  </div>

  <form id="multiForm">

    <!-- STEP 1 -->
    <div class="form-step active">
      <label>Full Name</label>
      <input type="text">
      <small class="error"></small>

      <label>Email</label>
      <input type="email">
      <small class="error"></small>

      <label>Phone Number</label>
      <input
  type="tel"
  id="phoneNumber"

  inputmode="numeric"
  autocomplete="tel"
>

      <small class="error"></small>

      <div class="buttons">
        <button type="reset" class="secondary">Reset</button>
        <button type="button" onclick="nextStep()">Next</button>
      </div>
    </div>

    <!-- STEP 2 -->
    <div class="form-step">
      <label>Company Name</label>
      <input type="text">
      <small class="error"></small>

      <label>Employee ID</label>
      <input type="text">
      <small class="error"></small>

      <label>Salary</label>
      <input type="number">
      <small class="error"></small>

      <label>Experience (Years)</label>
      <input type="number">
      <small class="error"></small>

      <div class="buttons">
        <button type="button" class="secondary" onclick="prevStep()">Previous</button>
        <button type="button" onclick="nextStep()">Next</button>
      </div>
    </div>

    <!-- STEP 3 -->
    <div class="form-step">
      <label>College Name</label>
      <input type="text">
      <small class="error"></small>

      <label>Degree Type</label>
      <input type="text">
      <small class="error"></small>

      <label>Percentage</label>
      <input type="number">
      <small class="error"></small>

      <div class="buttons">
        <button type="button" class="secondary" onclick="prevStep()">Previous</button>
        <button type="button" onclick="nextStep()">Next</button>
      </div>
    </div>
<!-- STEP 4 -->
<div class="form-step">
  <p style="text-align:center;">✅ Review & verify your details</p>

  <div class="buttons">
    <button type="button" class="secondary" onclick="prevStep()">Previous</button>
    <button type="button" onclick="verifyDetails()">Verify</button>
  </div>

  <div class="buttons" style="margin-top:10px;">
    <button type="submit" style="width:100%;" >Submit</button>
  </div>
</div>
<script>
const steps = document.querySelectorAll(".step");
const formSteps = document.querySelectorAll(".form-step");
const form = document.getElementById("multiForm");
const title = document.querySelector("h2");
const phoneInput = document.getElementById("phoneNumber");

let currentStep = 0;
let isVerifyMode = false;

/* ================= SHOW STEP ================= */
function showStep() {
  formSteps.forEach((step, i) => {
    step.classList.toggle("active", i === currentStep);
  });

  steps.forEach((step, i) => {
    step.classList.toggle("active", i === currentStep);
    step.classList.toggle("completed", i < currentStep);
  });
}

/* ================= VALIDATION HELPERS ================= */
function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function isValidPhone(phone) {
  return /^[6-9][0-9]{9}$/.test(phone); // Indian 10-digit
}

function showError(input, message) {
  input.nextElementSibling.textContent = message;
}

function clearError(input) {
  input.nextElementSibling.textContent = "";
}

/* ================= STEP VALIDATION ================= */
function validateStep() {
  let valid = true;
  const inputs = formSteps[currentStep].querySelectorAll("input");

  inputs.forEach(input => {
    const value = input.value.trim();

    /* Required validation */
    if (value === "") {
      showError(input, "This field is required");
      valid = false;
      return;
    }

    /* Email validation */
    if (input.type === "email" && !isValidEmail(value)) {
      showError(input, "Enter a valid email address");
      valid = false;
      return;
    }

    /* Phone validation */
    if (input.id === "phoneNumber" && !isValidPhone(value)) {
      showError(input, "Enter a valid 10-digit phone number");
      valid = false;
      return;
    }

    /* Number validation */
    if (input.type === "number" && isNaN(value)) {
      showError(input, "Only numbers allowed");
      valid = false;
      return;
    }

    clearError(input);
  });

  return valid;
}

/* ================= NAVIGATION ================= */
function nextStep() {
  if (!validateStep()) return;

  if (currentStep < formSteps.length - 1) {
    currentStep++;
    showStep();
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    showStep();
  }
}

/* ================= VERIFY ================= */
function verifyDetails() {
  isVerifyMode = true;
  currentStep = 0; // ✅ go to start
  title.textContent = "Verify Your Details";
  showStep();
}

/* ================= SUBMIT ================= */
form.addEventListener("submit", e => {
  e.preventDefault();

  let allValid = true;

  formSteps.forEach(step => {
    const inputs = step.querySelectorAll("input");

    inputs.forEach(input => {
      const value = input.value.trim();

      if (value === "") {
        showError(input, "This field is required");
        allValid = false;
      } else if (input.type === "email" && !isValidEmail(value)) {
        showError(input, "Enter a valid email address");
        allValid = false;
      } else if (input.id === "phoneNumber" && !isValidPhone(value)) {
        showError(input, "Enter a valid 10-digit phone number");
        allValid = false;
      } else {
        clearError(input);
      }
    });
  });

  if (!allValid) return;

  alert("Form Submitted Successfully!");

  form.reset();
  currentStep = 0;
  isVerifyMode = false;
  title.textContent = "Registration Form";
  showStep();
});

/* ================= PHONE INPUT RESTRICTION ================= */
phoneInput.addEventListener("input", () => {
  phoneInput.value = phoneInput.value
    .replace(/[^0-9]/g, "")
    .slice(0, 10);
});



</script>

</body>
</html>
